<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Horizon Lock Camera</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Camera Feed Container -->
        <div id="camera-container">
            <video id="camera-video" autoplay playsinline muted></video>
        </div>

        <!-- Permission Overlay -->
        <div id="permission-overlay" class="overlay active">
            <div class="overlay-content">
                <h1>Horizon Lock Camera</h1>
                <p>This app uses your camera and device orientation to keep the horizon level.</p>
                <button id="start-btn" class="btn-primary">Start Camera</button>
                <p id="permission-error" class="error-message"></p>
            </div>
        </div>

        <!-- Controls -->
        <div id="controls" class="controls hidden">
            <button id="toggle-camera" class="control-btn" title="Switch Camera">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 16c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0-13C6.48 3 2 7.48 2 13s4.48 10 10 10 10-4.48 10-10S17.52 3 12 3zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                </svg>
            </button>
            <button id="toggle-stabilization" class="control-btn active" title="Toggle Stabilization">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                </svg>
            </button>
            <button id="capture-btn" class="control-btn" title="Capture">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <circle cx="12" cy="12" r="10" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel hidden">
            <div class="setting">
                <label for="zoom-slider">Zoom Level</label>
                <input type="range" id="zoom-slider" min="1.5" max="3" step="0.1" value="2">
                <span id="zoom-value">2.0x</span>
            </div>
            <div class="setting">
                <label for="smoothing-slider">Smoothing</label>
                <input type="range" id="smoothing-slider" min="0.05" max="0.5" step="0.05" value="0.15">
                <span id="smoothing-value">0.15</span>
            </div>
            <button id="close-settings" class="btn-secondary">Close</button>
        </div>

        <!-- Status Indicator -->
        <div id="status" class="status hidden">
            <span id="status-text">Ready</span>
            <button id="settings-toggle" class="icon-btn">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>
        </div>

        <!-- Angle Display -->
        <div id="angle-display" class="angle-display hidden">
            <span id="angle-value">0°</span>
        </div>

        <!-- Canvas for capture (hidden) -->
        <canvas id="capture-canvas" style="display: none;"></canvas>
    </div>

    <script src="js/smoothing.js"></script>
    <script src="js/orientation.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
